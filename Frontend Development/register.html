<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register – BlogSphere</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="register">

  <!-- ====== NAVBAR ====== -->
  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="nav-logo">
        <i class="fa-solid fa-blog"></i>
        <span>BlogSphere</span>
      </a>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="index.html#blogs">Explore</a>
        <a href="login.html" class="guest-only">Login</a>
        <a href="register.html" class="btn-nav active guest-only">Register</a>
        <a href="dashboard.html" class="auth-only">Dashboard</a>
        <a href="#" class="auth-only" onclick="handleLogout();return false;">Logout</a>
      </div>
      <button class="hamburger" aria-label="Toggle navigation">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </nav>

  <!-- ====== REGISTER ====== -->
  <section class="auth-page">
    <div class="auth-container">
      <div class="auth-card">
        <div class="auth-header">
          <a href="index.html" class="nav-logo">
            <i class="fa-solid fa-blog"></i>
            <span>BlogSphere</span>
          </a>
          <h1>Create Account</h1>
          <p>Join BlogSphere and start sharing your ideas</p>
        </div>

        <form id="registerForm" novalidate>
          <div class="form-group">
            <label for="regName">Full Name</label>
            <div class="form-input-wrapper">
              <i class="fa-regular fa-user field-icon"></i>
              <input type="text" id="regName" placeholder="Enter your full name" autocomplete="name">
            </div>
            <p class="form-error"></p>
          </div>

          <div class="form-group">
            <label for="regEmail">Email Address</label>
            <div class="form-input-wrapper">
              <i class="fa-regular fa-envelope field-icon"></i>
              <input type="email" id="regEmail" placeholder="Enter your email" autocomplete="email">
            </div>
            <p class="form-error"></p>
          </div>

          <div class="form-group">
            <label for="regPassword">Password</label>
            <div class="form-input-wrapper">
              <i class="fa-solid fa-lock field-icon"></i>
              <input type="password" id="regPassword" placeholder="Create a password (min 6 chars)" autocomplete="new-password">
              <button type="button" class="toggle-password" aria-label="Toggle password visibility">
                <i class="fa-regular fa-eye"></i>
              </button>
            </div>
            <p class="form-error"></p>
          </div>

          <div class="form-group">
            <label for="regConfirm">Confirm Password</label>
            <div class="form-input-wrapper">
              <i class="fa-solid fa-shield-halved field-icon"></i>
              <input type="password" id="regConfirm" placeholder="Re-enter your password" autocomplete="new-password">
              <button type="button" class="toggle-password" aria-label="Toggle password visibility">
                <i class="fa-regular fa-eye"></i>
              </button>
            </div>
            <p class="form-error"></p>
          </div>

          <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top:8px">
            <i class="fa-solid fa-user-plus"></i> Create Account
          </button>
        </form>

        <div class="auth-footer">
          <p>Already have an account? <a href="login.html">Sign in</a></p>
        </div>
      </div>
    </div>
  </section>

  <script src="js/auth.js"></script>
  <script src="js/blogs.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
