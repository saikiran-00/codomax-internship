<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login – BlogSphere</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="login">

  <!-- ====== NAVBAR ====== -->
  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="nav-logo">
        <i class="fa-solid fa-blog"></i>
        <span>BlogSphere</span>
      </a>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="index.html#blogs">Explore</a>
        <a href="login.html" class="active guest-only">Login</a>
        <a href="register.html" class="btn-nav guest-only">Register</a>
        <a href="dashboard.html" class="auth-only">Dashboard</a>
        <a href="#" class="auth-only" onclick="handleLogout();return false;">Logout</a>
      </div>
      <button class="hamburger" aria-label="Toggle navigation">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </nav>

  <!-- ====== LOGIN ====== -->
  <section class="auth-page">
    <div class="auth-container">
      <div class="auth-card">
        <div class="auth-header">
          <a href="index.html" class="nav-logo">
            <i class="fa-solid fa-blog"></i>
            <span>BlogSphere</span>
          </a>
          <h1>Welcome Back</h1>
          <p>Sign in to your account to continue</p>
        </div>

        <form id="loginForm" novalidate>
          <div class="form-group">
            <label for="loginEmail">Email Address</label>
            <div class="form-input-wrapper">
              <i class="fa-regular fa-envelope field-icon"></i>
              <input type="email" id="loginEmail" placeholder="Enter your email" autocomplete="email">
            </div>
            <p class="form-error"></p>
          </div>

          <div class="form-group">
            <label for="loginPassword">Password</label>
            <div class="form-input-wrapper">
              <i class="fa-solid fa-lock field-icon"></i>
              <input type="password" id="loginPassword" placeholder="Enter your password" autocomplete="current-password">
              <button type="button" class="toggle-password" aria-label="Toggle password visibility">
                <i class="fa-regular fa-eye"></i>
              </button>
            </div>
            <p class="form-error"></p>
          </div>

          <div class="form-row">
            <label class="checkbox-wrapper">
              <input type="checkbox" id="rememberMe">
              Remember me
            </label>
            <a href="#" class="form-link">Forgot Password?</a>
          </div>

          <button type="submit" class="btn btn-primary btn-block btn-lg">
            <i class="fa-solid fa-right-to-bracket"></i> Sign In
          </button>
        </form>

        <div class="auth-footer">
          <p>Don't have an account? <a href="register.html">Create one</a></p>
        </div>
      </div>
    </div>
  </section>

  <script src="js/auth.js"></script>
  <script src="js/blogs.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
